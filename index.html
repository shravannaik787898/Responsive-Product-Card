<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Day 28 - Responsive Product Card</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .product-card { background: white; width: 100%; max-width: 300px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 180px; background: #ddd; display: flex; align-items: center; justify-content: center; color: #666; }
        .product-body { padding: 15px; }
        .price { color: #28a745; font-size: 20px; font-weight: bold; margin: 10px 0; }
        .btn { display: block; width: 100%; padding: 10px; background: #007bff; color: white; text-align: center; text-decoration: none; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="product-card">
        <div class="product-img">Product Image</div>
        <div class="product-body">
            <h3>SEO Growth Package</h3>
            <div class="price">₹4,999</div>
            <p>Comprehensive keyword optimization for Sanctify clients.</p>
            <a href="#" class="btn">Add to Cart</a>
        </div>
    </div>
</body>
</html>
